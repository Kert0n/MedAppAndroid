# Релиз сборки main. У каждой сборки, вышедшей из main, **свой релиз**: тег `v1.2`, заголовок
# «MedApp 1.2», APK тем же номером. Прежние релизы остаются на месте — ряд версий это история
# того, что раздавали, и перезаписывать её нечем; самый свежий GitHub сам помечает как Latest.
#
# Идёт **после** «Проверки»: публиковать из main, не дождавшись тестов и lint, значит раздавать
# то, что не собиралось. Поэтому триггер — успешное завершение той сборки на том же коммите, а не
# push сам по себе.
name: Релиз сборки main

on:
  workflow_run:
    workflows: [Проверка]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # Метка `release: skip` читается с PR, который принёс коммит.
  pull-requests: read

# Группа очереди — по коммиту, а не одна на всё. Общая группа держала бы публикации в очередь
# друг за другом, а **ждущий** прогон GitHub отменяет, когда приходит следующий: слейся два
# изменения подряд — и релиз среднего не вышел бы вовсе. Делить публикациям нечего: у каждой свой
# тег и своё вложение. Своя группа остаётся у повторов одного коммита, и на ходу публикация не
# отменяется — прерванная между сборкой и заведением релиза оставила бы версию без релиза молча.
concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Сборка и релиз
    # Чужой форк тоже проходит «Проверку» — она про debug и секретов не просит. Пускать его
    # сборку к ключу подписи нельзя: публикуем только то, что пришло из своего репозитория.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Коммит тот же, что проверяла «Проверка», а не голова main: между ними мог лечь ещё один.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # История целиком: сравнивать приходится с коммитом прошлого релиза.
          fetch-depth: 0

      # Релиз — новая сборка приложения, а не новый коммит. PR, который тронул только проверки,
      # документы или CI, APK не меняет, и выпускать то же самое под новым номером незачем: такие
      # PR войдут в заметки следующего настоящего релиза. Пропустить релиз можно и руками — меткой
      # `release: skip` на PR. Ручной запуск (workflow_dispatch) публикует всегда: это и есть решение
      # человека.
      - name: Нужен ли релиз
        id: need
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          publish=true
          reason="ручной запуск"
          if [ "$EVENT" != "workflow_dispatch" ]; then
            sha=$(git rev-parse HEAD)
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '[.[].labels[].name] | join(",")')
            previous=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // empty')
            # Из чего собирается APK. Проверки (test, androidTest, sharedTest), схемы Room, документы,
            # скрипты и CI в него не попадают.
            built="app/src/main app/build.gradle.kts app/proguard-rules.pro build.gradle.kts settings.gradle.kts gradle.properties gradle"
            if [[ ",$labels," == *",release: skip,"* ]]; then
              publish=false
              reason="метка «release: skip» на PR"
            elif [ -z "$previous" ]; then
              reason="прежних релизов нет"
            elif git diff --quiet "$previous" "$sha" -- $built; then
              publish=false
              reason="с $previous не изменилось ничего, из чего собирается приложение"
            else
              reason="с $previous изменилось: $(git diff --name-only "$previous" "$sha" -- $built | head -5 | paste -sd ',' -)"
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Релиз: $publish — $reason" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: JDK
        if: steps.need.outputs.publish == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle
        if: steps.need.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@v5

      # Ключ подписи в репозитории не лежит (G1): он приходит секретом и живёт только в этом
      # прогоне. Без него сборка не подписывается, и вложению неоткуда взяться.
      - name: Ключ подписи
        if: steps.need.outputs.publish == 'true'
        env:
          KEYSTORE: ${{ secrets.MEDAPP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Секрет MEDAPP_KEYSTORE_BASE64 не задан: подписать release нечем."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE" | base64 -d > keystore/medapp-release.jks

      - name: Сборка
        if: steps.need.outputs.publish == 'true'
        env:
          MEDAPP_KEYSTORE_FILE: keystore/medapp-release.jks
          MEDAPP_KEYSTORE_PASSWORD: ${{ secrets.MEDAPP_KEYSTORE_PASSWORD }}
          MEDAPP_KEY_ALIAS: ${{ secrets.MEDAPP_KEY_ALIAS }}
          MEDAPP_KEY_PASSWORD: ${{ secrets.MEDAPP_KEY_PASSWORD }}
          MEDAPP_REGISTRATION_TOKEN: ${{ secrets.MEDAPP_REGISTRATION_TOKEN }}
          MEDAPP_BASE_URL: ${{ secrets.MEDAPP_BASE_URL }}
          MEDAPP_CRPT_BASE_URL: ${{ secrets.MEDAPP_CRPT_BASE_URL }}
          # Счёт публикаций ведёт сам прогон: у каждой сборки, уехавшей в latest, минорная версия
          # на единицу больше прежней, а `versionCode` растёт вместе с ней.
          MEDAPP_PUBLICATION: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease

      # Неподписанная сборка называется иначе (`app-release-unsigned.apk`), поэтому имя файла здесь
      # и есть проверка подписи: подменить его нечем.
      - name: Релиз
        if: steps.need.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          # Та же версия, что собрана: номер публикации ведёт сам прогон.
          version="1.$GITHUB_RUN_NUMBER"
          tag="v$version"
          file="medapp-$version-release.apk"
          cp "$apk" "$file"
          # Повтор прогона несёт ту же версию того же коммита: её релиз уже заведён, и трогать его
          # незачем — вложение в нём то же самое.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Релиз $tag уже заведён — повтор прогона его не трогает."
            exit 0
          fi
          # Заметки — что изменилось с прошлого релиза: PR, слитые с него, разложенные по разделам
          # (.github/release.yml). Прошлый релиз называется явно, до заведения нового: иначе GitHub
          # выбирает его сам, и после пропущенной публикации заметки молча захватили бы не тот ряд.
          previous=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // empty')
          # Релиз заводится вместе со своим вложением одной командой: не вышло — нет ни релиза, ни
          # полупустого тега, а прежние релизы стоят нетронутыми.
          gh release create "$tag" "$file" \
            --target "$(git rev-parse HEAD)" \
            --title "MedApp $version" \
            --latest \
            --notes "Сборка main: $(git log -1 --pretty='%s') ($(git rev-parse --short HEAD))." \
            --generate-notes \
            ${previous:+--notes-start-tag "$previous"}

      - name: Ключ подписи не остаётся
        if: always()
        run: rm -f keystore/medapp-release.jks
