# Заметки к релизу собирает сам GitHub (`gh release create --generate-notes` в workflows/release.yml):
# это PR, слитые в main с прошлого релиза, с их заголовками. Заголовок PR поэтому пишется так,
# чтобы его можно было прочесть в заметке, — утверждением о том, что изменилось.
#
# Разделы — по меткам областей, которые ставит pr-labeler (labeler.yml): других меток на PR нет.
# PR попадает в первый раздел, чья метка на нём есть, поэтому раздел, который человек замечает,
# стоит выше: правка экрана с доменом внутри — это «Экраны», а не «Под капотом».
changelog:
  categories:
    - title: Экраны и поведение
      labels: ["area: ui", "area: scanner", "area: analytics"]
    - title: Уведомления
      labels: ["area: notifications"]
    - title: Синхронизация и сеть
      labels: ["area: sync", "area: network"]
    - title: Под капотом
      labels: ["*"]
